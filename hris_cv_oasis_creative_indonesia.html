<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
  import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
  import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

  const appId = typeof __app_id !== 'undefined' ? __app_id : 'oasis-hris-default';
  window.__OASIS_CLOUD__ = {
    ready: false,
    appId,
    db: null,
    auth: null,
    user: null,
    doc,
    setDoc,
    onSnapshot
  };

  async function bootCloud() {
    try {
      if (typeof __firebase_config === 'undefined' || !__firebase_config) {
        window.dispatchEvent(new CustomEvent('oasis-cloud-status', { detail: { connected: false } }));
        return;
      }
      const firebaseConfig = JSON.parse(__firebase_config);
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
        await signInWithCustomToken(auth, __initial_auth_token);
      } else {
        await signInAnonymously(auth);
      }

      onAuthStateChanged(auth, (user) => {
        if (user) {
          window.__OASIS_CLOUD__.user = user;
          window.__OASIS_CLOUD__.db = db;
          window.__OASIS_CLOUD__.auth = auth;
          window.__OASIS_CLOUD__.ready = true;
          window.dispatchEvent(new CustomEvent('oasis-cloud-status', { detail: { connected: true, user } }));
        }
      });
    } catch (err) {
      window.dispatchEvent(new CustomEvent('oasis-cloud-status', { detail: { connected: false } }));
    }
  }

  bootCloud();
</script>

function saveFile(filename, data, mime = 'application/octet-stream') {
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 500);
}

function computeEmployeePayroll(emp, records, hrSettings, customOverride = null) {
  const empAbsences = records.filter(r => r.empId === emp.id && r.category === 'Absensi');
  const totalLateMins = empAbsences.reduce((sum, r) => sum + (r.overrideByAdmin ? 0 : (r.lateMinutes || 0)), 0);

  const hasCustom = customOverride && typeof customOverride === 'object' && (
    customOverride.baseSalary !== undefined ||
    customOverride.allowances !== undefined ||
    customOverride.lateDeduction !== undefined ||
    customOverride.leaveDeduction !== undefined
  );

  const baseSalary = customOverride && customOverride.baseSalary !== undefined ? Number(customOverride.baseSalary) : Number(emp.baseSalary || 0);
  const allowances = customOverride && customOverride.allowances !== undefined ? Number(customOverride.allowances) : Number(emp.allowances || 0);
  const lateDeduction = customOverride && customOverride.lateDeduction !== undefined ? Number(customOverride.lateDeduction) : 0;
  const leaveDeduction = customOverride && customOverride.leaveDeduction !== undefined ? Number(customOverride.leaveDeduction) : 0;
  const periodMonth = (customOverride && customOverride.periodMonth) || new Date().toISOString().slice(0, 7);
  const hrNote = (customOverride && customOverride.hrNote) || '';

  const gross = baseSalary + allowances;
  const totalDeduction = lateDeduction + leaveDeduction;
  const netSalary = Math.max(0, gross - totalDeduction);

  return {
    emp,
    periodMonth,
    hrNote,
    isEditedByHrd: Boolean(hasCustom),
    totalLateMins,
    baseSalary,
    allowances,
    lateDeduction,
    leaveDeduction,
    gross,
    totalDeduction,
    netSalary
  };
}

function exportXlsx(rows, hrSettings, dateStamp) {
  const head = ['No', 'ID Log', 'ID Karyawan', 'Nama', 'Divisi', 'Tanggal', 'Jam Masuk', 'Jam Pulang', 'Lokasi GPS', 'Terlambat (Menit)', 'Denda (Rp)', 'Status'];
  const body = rows.map((r, i) => {
    const late = r.overrideByAdmin ? 0 : r.lateMinutes;
    const status = r.overrideByAdmin ? 'Dispensasi HRD' : late > 0 ? `Terlambat (${late} Menit)` : 'Tepat Waktu';
    return [i + 1, r.id, r.empId, r.empName, r.dept, r.date, r.clockIn, r.clockOut, r.location, late, late * hrSettings.lateFinePerMinute, status];
  });
  const ws = XLSX.utils.aoa_to_sheet([head, ...body]);
  ws['!cols'] = [6, 10, 12, 24, 26, 12, 10, 10, 44, 16, 14, 22].map(w => ({ wch: w }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Rekap Presensi');
  const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  saveFile(`Rekap_Presensi_Oasis_${dateStamp}.xlsx`, new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
}

function formatGoogleDriveImageUrl(url) {
  if (!url || typeof url !== 'string') return '';
  const trimmed = url.trim();
  if (!trimmed) return '';
  const fileDMatch = trimmed.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
  if (fileDMatch && fileDMatch[1]) {
    return `https://lh3.googleusercontent.com/d/${fileDMatch[1]}`;
  }
  const openIdMatch = trimmed.match(/drive\.google\.com\/(?:open|uc|thumbnail)\?(?:.*&)?id=([a-zA-Z0-9_-]+)/);
  if (openIdMatch && openIdMatch[1]) {
    return `https://lh3.googleusercontent.com/d/${openIdMatch[1]}`;
  }
  return trimmed;
}

function calculateDistanceMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = (deg) => (deg * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return Math.round(R * c);
}

function classifyApprovalCategory(rec) {
  if (rec.category === 'Izin' || rec.category === 'Cuti' || rec.category === 'Sakit' || rec.category === 'Lembur' || rec.category === 'Ganti Jam') {
    return rec.category;
  }
  const combined = `${rec.subType || ''} ${rec.detail || ''}`.toLowerCase();
  if (combined.includes('sakit')) return 'Sakit';
  if (combined.includes('cuti')) return 'Cuti';
  if (combined.includes('lembur')) return 'Lembur';
  if (combined.includes('ganti')) return 'Ganti Jam';
  return 'Izin';
}

  // ==========================================
  const handleLogin = (e) => {
    e.preventDefault();
    setLoginError('');

    if (activeLoginRole === 'karyawan') {
      const cleanId = loginEmpId.trim().toLowerCase();
      const user = employees.find(emp => (emp.id || '').trim().toLowerCase() === cleanId);
      if (!user) {
        setLoginError('ID Karyawan tidak terdaftar di database HRIS Oasis!');
        return;
      }
      if (loginEmpPass !== user.password) {
        setLoginError('Password Karyawan salah! Hubungi HRD jika lupa.');
        return;
      }
      const hasFieldAccess =
        typeof user.requiresFieldDuty === 'boolean'
          ? user.requiresFieldDuty
          : ['Departemen Dokumentasi', 'Marketing', 'Project Coordinator'].includes(user.dept);
      setCurrentUser({ ...user, requiresFieldDuty: hasFieldAccess, isHrdAdmin: false });
      setRevealSecretCreds(false);
      setShowChangePassBox(false);
      setIsAuthenticated(true);
      showToast(`Selamat datang kembali, ${user.name}!`);
    } else {
      const cleanHrdId = loginHrdId.trim().toLowerCase();
      const hrdUser = employees.find(
        emp => (emp.id || '').trim().toLowerCase() === cleanHrdId && emp.userRole && emp.userRole.includes('Admin')
      );
      if ((hrdUser && loginHrdPass === hrdUser.password) || (cleanHrdId === 'hrd001' && loginHrdPass === DEFAULT_HRD_PASS)) {
        setCurrentUser({
          id: hrdUser ? hrdUser.id : 'HRD001',
          name: hrdUser ? hrdUser.name : 'HRD Management',
          isHrdAdmin: true,
          photo: hrdUser ? hrdUser.photo : 'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=150&auto=format&fit=crop&q=80'
        });
        setIsAuthenticated(true);
        showToast('Akses Master HRD & Manajemen aktif.');
      } else {
        setLoginError('ID HRD atau Password HRD tidak valid!');
      }
    }
  };

  const handleLogout = () => {
    stopCameraStream();
    setSelfieImage('');
    setRevealSecretCreds(false);
    setShowChangePassBox(false);
    setIsAuthenticated(false);
    setCurrentUser(null);
    setLoginEmpId('');
    setLoginEmpPass('');
    setLoginHrdId('');
    setLoginHrdPass('');
    setLoginError('');
  };

  const handleSavePersonalPassword = (e) => {
    e.preventDefault();
    const trimmed = newPersonalPass.trim();
    if (trimmed.length < 4) {
      showToast('Password baru minimal 4 karakter!', 'error');
      return;
    }
    const targetEmp = activeEmployeeProfile || currentUser;
    const updatedList = employees.map(emp =>
      emp.id === targetEmp.id ? { ...emp, password: trimmed } : emp
    );
    updateEmployees(updatedList);
    setCurrentUser({ ...targetEmp, password: trimmed });
    setNewPersonalPass('');
    setShowChangePassBox(false);
    showToast('Password rahasia Anda berhasil diperbarui & tersinkron ke sistem!');
  };

  const handleDownloadSlipPdf = (payrollObj) => {
    try {
      generatePayslipPdf(payrollObj);
      showToast(`Slip Gaji PDF (${payrollObj.emp.name}) berhasil diunduh otomatis!`);
    } catch (err) {
      showToast(err.message || 'Gagal mengunduh PDF slip gaji.', 'error');
    }
  };

  // ==========================================
  // KARYAWAN OPERATIONAL ACTIONS
  // ==========================================
  const dynamicLocationOptions = useMemo(() => {
    const others = PRESET_YOGYA_LOCATIONS.filter(
      loc => !loc.name.toLowerCase().includes('oasis creative hq')
    );
    return [
      { name: officeLocation.name, lat: officeLocation.lat, lng: officeLocation.lng, isOffice: true },
      ...others
    ];
  }, [officeLocation]);

  const currentDistanceFromOffice = useMemo(() => {
    return calculateDistanceMeters(
      gpsCoords.lat,
      gpsCoords.lng,
      officeLocation.lat,
      officeLocation.lng
    );
  }, [gpsCoords, officeLocation]);

  const refreshGps = () => {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const userLat = Number(pos.coords.latitude.toFixed(6));
          const userLng = Number(pos.coords.longitude.toFixed(6));
          const dist = calculateDistanceMeters(userLat, userLng, officeLocation.lat, officeLocation.lng);
          setGpsCoords({
            lat: userLat,
            lng: userLng,
            area: dist <= officeLocation.radiusMeters
              ? `${officeLocation.name} (Dalam Radius ${dist}m)`
              : `Lokasi GPS Perangkat (${dist}m dari Kantor)`
          });
          showToast('Titik koordinat GPS perangkat berhasil dikunci.');
        },
        () => {
          setGpsCoords({
            lat: officeLocation.lat,
            lng: officeLocation.lng,
            area: officeLocation.name
          });
          showToast(`Koordinat GPS dikunci ke ${officeLocation.name}.`);
        },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    }
  };

  const handleAbsenAction = (type) => {
    const empUser = activeEmployeeProfile || currentUser;
    if (!selfieImage) {
      showToast('Wajib mengambil foto swafoto kamera secara langsung sebelum presensi!', 'error');
      return;
    }
    const todayStr = localDate(nowTime);
    const timeStr = `${String(nowTime.getHours()).padStart(2, '0')}:${String(nowTime.getMinutes()).padStart(2, '0')}`;

    if (empUser.requiresFieldDuty) {
      const hasFieldCheckInToday = fieldLogs.some(
        log => log.empId === empUser.id && log.date === todayStr
      );
      if (!hasFieldCheckInToday) {
        showToast(
          'Karyawan Tugas Lapangan wajib mengisi Check-in Aktivitas (Visit, Presentasi, Photoshoot, atau Videoshoot) terlebih dahulu!',
          'error'
        );
        return;
      }
    }

    const existingIndex = records.findIndex(
      r => r.empId === empUser.id && r.date === todayStr && r.category === 'Absensi'
    );

    if (type === 'Masuk') {
      if (existingIndex !== -1) {
        showToast('Anda sudah tercatat melakukan Absen Masuk hari ini.', 'error');
        return;
      }
      const [targetH, targetM] = (hrSettings.officeStartTime || '09:00').split(':').map(Number);
      let lateMins = 0;
      const nowTotalMins = nowTime.getHours() * 60 + nowTime.getMinutes();
      const targetTotalMins = (targetH || 9) * 60 + (targetM || 0);
      if (nowTotalMins > targetTotalMins) {
        lateMins = nowTotalMins - targetTotalMins;
      }

      const newRec = {
        id: `REC-${Math.floor(100 + Math.random() * 900)}`,
        empId: empUser.id,
        empName: empUser.name,
        dept: empUser.dept,
        category: 'Absensi',
        subType: 'Presensi Reguler',
        date: todayStr,
        clockIn: timeStr,
        clockOut: '--:--',
        location: `${gpsCoords.area} (${gpsCoords.lat}, ${gpsCoords.lng})`,
        detail: lateMins > 0 ? `Presensi Masuk (Terlambat ${lateMins} m)` : 'Presensi Masuk Tepat Waktu',
        lateMinutes: lateMins,
        overrideByAdmin: false,
        selfieInPhoto: selfieImage,
        selfieOutPhoto: '',
        status: 'Disetujui'
      };
      updateRecords([newRec, ...records]);
      setSelfieImage('');
      showToast(`Absen Masuk & swafoto berhasil dicatat pada pukul ${timeStr} WIB!`);
    } else {
      if (existingIndex === -1) {
        showToast('Anda belum melakukan Absen Masuk hari ini!', 'error');
        return;
      }
      const updated = [...records];
      updated[existingIndex] = {
        ...updated[existingIndex],
        clockOut: timeStr,
        selfieOutPhoto: selfieImage
      };
      updateRecords(updated);
      setSelfieImage('');
      showToast(`Absen Pulang & swafoto pulang berhasil dicatat pada pukul ${timeStr} WIB!`);
    }
  };

  const handleSubmitKaryawanRequest = (e, formCategory) => {
    e.preventDefault();
    const empUser = activeEmployeeProfile || currentUser;
    const todayStr = localDate(nowTime);
    let newRec = {
      id: `REQ-${Math.floor(100 + Math.random() * 900)}`,
      empId: empUser.id,
      empName: empUser.name,
      dept: empUser.dept,
      category: formCategory,
      subType: '',
      date: todayStr,
      clockIn: '-',
      clockOut: '-',
      location: '-',
      detail: '',
      lateMinutes: 0,
      overrideByAdmin: false,
      status: 'Menunggu Approval'
    };

    if (formCategory === 'PerizinanUnified') {
      newRec.category = iznForm.category;
      newRec.subType = iznForm.type;
      newRec.date = iznForm.date || todayStr;
      newRec.detail = `${iznForm.type}: ${iznForm.reason}`;
      setIznForm({ category: 'Izin', type: 'Izin Mendadak', date: '', reason: '' });
    } else if (formCategory === 'Lembur') {
      newRec.subType = `${lbrForm.duration} Jam (${lbrForm.project})`;
      newRec.date = lbrForm.date || todayStr;
      newRec.detail = `[${lbrForm.project}] ${lbrForm.duration} Jam - ${lbrForm.reason}`;
      setLbrForm({ date: '', duration: '2', project: '', reason: '' });
    } else if (formCategory === 'Ganti Jam') {
      newRec.subType = `Pengganti tgl ${gtForm.origDate}`;
      newRec.date = gtForm.swapDate || todayStr;
      newRec.detail = `Pengganti tgl ${gtForm.origDate}: ${gtForm.reason}`;
      setGtForm({ origDate: '', swapDate: '', reason: '' });
    }

    updateRecords([newRec, ...records]);
    showToast(`Pengajuan ${newRec.category} berhasil terkirim ke Portal HRD!`);
  };

  const handleCheckInFieldDuty = (e) => {
    e.preventDefault();
    const empUser = activeEmployeeProfile || currentUser;
    if (!fieldDutyForm.clientOrVenue.trim()) {
      showToast('Masukkan nama klien atau lokasi tugas lapangan!', 'error');
      return;
    }
    if (!fieldDutyForm.notes.trim()) {
      showToast('Detail kegiatan & deliverables wajib diisi!', 'error');
      return;
    }
    const todayStr = localDate(nowTime);
    const timeStr = `${String(nowTime.getHours()).padStart(2, '0')}:${String(nowTime.getMinutes()).padStart(2, '0')}`;

    const newFieldPin = {
      id: `FLD-${Math.floor(100 + Math.random() * 900)}`,
      empId: empUser.id,
      empName: empUser.name,
      dept: empUser.dept,
      photo: empUser.photo,
      activityType: fieldDutyForm.activityType,
      clientOrVenue: fieldDutyForm.clientOrVenue,
      notes: fieldDutyForm.notes || `Tugas lapangan ${fieldDutyForm.activityType}`,
      lat: gpsCoords.lat,
      lng: gpsCoords.lng,
      date: todayStr,
      time: timeStr,
      status: 'Aktif di Lokasi'
    };

    updateFieldLogs([newFieldPin, ...fieldLogs]);
    setSelectedRadarPinId(newFieldPin.id);
    setFieldDutyForm({ activityType: 'Visit', clientOrVenue: '', notes: '' });
    showToast(`Check-in ${newFieldPin.activityType} di ${newFieldPin.clientOrVenue} terdeteksi di Radar Map HRD!`);
  };

  // ==========================================
  // HRD COMPUTED DATA & SPREADSHEET EXPORT
  // ==========================================
  const filteredAttendanceLogs = useMemo(() => {
    return records.filter(r => {
      if (r.category !== 'Absensi') return false;
      const matchMonth = attendanceFilterMonth === 'ALL' || r.date.startsWith(attendanceFilterMonth);
      const matchDept = attendanceFilterDept === 'ALL' || r.dept === attendanceFilterDept;
      return matchMonth && matchDept;
    });
  }, [records, attendanceFilterMonth, attendanceFilterDept]);

  const handleDownloadAttendanceSpreadsheet = (format = 'xls') => {
    const dataToExport = filteredAttendanceLogs;
    if (dataToExport.length === 0) {
      showToast('Tidak ada data presensi pada filter yang dipilih untuk diunduh.', 'error');
      return;
    }
    const dateStamp = new Date().toISOString().split('T')[0];

    if (format === 'xls') {
      exportXlsx(dataToExport, hrSettings, dateStamp);
      showToast('File Excel (.xlsx) presensi siap diunduh!');
    } else {
      const headers = ['No', 'ID Log', 'ID Karyawan', 'Nama Karyawan', 'Divisi', 'Tanggal', 'Jam Masuk', 'Jam Pulang', 'Lokasi GPS', 'Keterlambatan (Menit)', 'Potongan Denda (Rp)', 'Status'];
      const rows = dataToExport.map((rec, idx) => {
        const effectiveLate = rec.overrideByAdmin ? 0 : rec.lateMinutes;
        const fine = effectiveLate * hrSettings.lateFinePerMinute;
        const statusText = rec.overrideByAdmin ? 'Dispensasi HRD' : effectiveLate > 0 ? 'Terlambat' : 'Tepat Waktu';
        return [idx + 1, rec.id, rec.empId, `"${rec.empName}"`, `"${rec.dept}"`, rec.date, rec.clockIn, rec.clockOut, `"${rec.location}"`, effectiveLate, fine, statusText].join(',');
      });
      const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');
      saveFile(`Rekap_Presensi_Oasis_${dateStamp}.csv`, csvContent, 'text/csv;charset=utf-8;');
      showToast('File CSV Spreadsheet presensi berhasil diunduh!');
    }
  };

  const separatedApprovals = useMemo(() => {
    const groups = { Izin: [], Cuti: [], Sakit: [], Lembur: [], 'Ganti Jam': [] };
    records.forEach(r => {
      if (r.category === 'Absensi') return;
      if (approvalStatusFilter !== 'ALL' && r.status !== approvalStatusFilter) return;
      const normalizedCat = classifyApprovalCategory(r);
      if (groups[normalizedCat]) groups[normalizedCat].push(r);
      else groups.Izin.push(r);
    });
    return groups;
  }, [records, approvalStatusFilter]);

  const handleUpdateApprovalStatus = (recordId, newStatus) => {
    updateRecords(records.map(item => (item.id === recordId ? { ...item, status: newStatus } : item)));
    showToast(`Status pengajuan berhasil diperbarui menjadi "${newStatus}".`);
  };

  const topPerformers = useMemo(() => {
    return [...employees].sort((a, b) => b.kpiScore - a.kpiScore).slice(0, 3);
  }, [employees]);

  const filteredEmployees = useMemo(() => {
    return employees.filter(
      e => e.name.toLowerCase().includes(empSearch.toLowerCase()) || e.id.toLowerCase().includes(empSearch.toLowerCase()) || e.dept.toLowerCase().includes(empSearch.toLowerCase())
    );
  }, [employees, empSearch]);

  const filteredKpiEmployees = useMemo(() => {
    return employees
      .filter(e => kpiDeptFilter === 'ALL' || e.dept === kpiDeptFilter)
      .sort((a, b) => b.kpiScore - a.kpiScore);
  }, [employees, kpiDeptFilter]);

  const filteredTasks = useMemo(() => {
    return hrdTasks.filter(t => {
      const pMatch = taskPriorityFilter === 'ALL' || t.priority === taskPriorityFilter;
      const dMatch = taskPeriodFilter === 'ALL' || t.period === taskPeriodFilter;
      return pMatch && dMatch;
    });
  }, [hrdTasks, taskPriorityFilter, taskPeriodFilter]);

  const weeklyTasksRecap = useMemo(() => {
    const weeklyItems = hrdTasks.filter(t => (t.period || 'Weekly') === 'Weekly');
    const doneCount = weeklyItems.filter(t => t.status === 'Done').length;
    const inProgressCount = weeklyItems.filter(t => t.status === 'In Progress').length;
    const todoCount = weeklyItems.filter(t => t.status === 'To-Do').length;
    const completionPct = weeklyItems.length > 0 ? Math.round((doneCount / weeklyItems.length) * 100) : 0;
    return {
      items: weeklyItems,
      total: weeklyItems.length,
      doneCount,
      inProgressCount,
      todoCount,
      completionPct
    };
  }, [hrdTasks]);

  const monthlyAttendanceStats = useMemo(() => {
    const [yr, mo] = (attendanceChartMonth || '2026-11').split('-').map(Number);
    let workingDays = 22;
    if (yr && mo) {
      const daysInMo = new Date(yr, mo, 0).getDate();
      let weekdays = 0;
      for (let d = 1; d <= daysInMo; d++) {
        const dayOfWeek = new Date(yr, mo - 1, d).getDay();
        if (dayOfWeek !== 0 && dayOfWeek !== 6) weekdays++;
      }
      workingDays = Math.max(1, weekdays);
    }

    return employees.map(emp => {
      const monthRecs = records.filter(
        r => r.empId === emp.id && (r.date || '').startsWith(attendanceChartMonth)
      );
      const presentDates = new Set(
        monthRecs.filter(r => r.category === 'Absensi').map(r => r.date)
      );
      const presentDays = presentDates.size;
      const onTimeDays = monthRecs.filter(
        r => r.category === 'Absensi' && (r.overrideByAdmin || (r.lateMinutes || 0) === 0)
      ).length;
      const percentage = Math.min(100, Math.round((presentDays / workingDays) * 100));
      return {
        emp,
        presentDays,
        onTimeDays,
        workingDays,
        percentage
      };
    });
  }, [employees, records, attendanceChartMonth]);

  const filteredAgendas = useMemo(() => {
    return hrdAgendas.filter(ag => {
      const matchDate = !filterAgendaDate || ag.date === filterAgendaDate;
      const matchTime = !filterAgendaTime || ag.startTime.includes(filterAgendaTime);
      const matchQuery =
        !filterAgendaQuery ||
        ag.title.toLowerCase().includes(filterAgendaQuery.toLowerCase()) ||
        ag.category.toLowerCase().includes(filterAgendaQuery.toLowerCase());
      return matchDate && matchTime && matchQuery;
    });
  }, [hrdAgendas, filterAgendaDate, filterAgendaTime, filterAgendaQuery]);

  const calendarDays = useMemo(() => {
    const year = calMonth.getFullYear();
    const month = calMonth.getMonth();
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const cells = [];
    for (let i = 0; i < firstDay; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      cells.push({ day: d, dateStr });
    }
    return cells;
  }, [calMonth]);

  const payrollPeriodKey = `${payrollEmpId}__${payrollMonth}`;
  const selectedPayrollData = useMemo(() => {
    const emp = employees.find(e => e.id === payrollEmpId) || employees[0];
    const custom = payrollOverrides[payrollPeriodKey] || null;
    return computeEmployeePayroll(emp, records, hrSettings, { ...(custom || {}), periodMonth: payrollMonth });
  }, [employees, records, payrollEmpId, payrollMonth, payrollPeriodKey, payrollOverrides, hrSettings]);

  useEffect(() => {
    setPayrollEditForm({
      baseSalary: selectedPayrollData.baseSalary,
      allowances: selectedPayrollData.allowances,
      lateDeduction: selectedPayrollData.lateDeduction,
      leaveDeduction: selectedPayrollData.leaveDeduction,
      hrNote: selectedPayrollData.hrNote || ''
    });
  }, [payrollPeriodKey, selectedPayrollData.baseSalary, selectedPayrollData.allowances, selectedPayrollData.lateDeduction, selectedPayrollData.leaveDeduction, selectedPayrollData.hrNote]);

  const liveDraftPayroll = useMemo(() => {
    const emp = employees.find(e => e.id === payrollEmpId) || employees[0];
    return computeEmployeePayroll(emp, records, hrSettings, {
      baseSalary: Number(payrollEditForm.baseSalary) || 0,
      allowances: Number(payrollEditForm.allowances) || 0,
      lateDeduction: Number(payrollEditForm.lateDeduction) || 0,
      leaveDeduction: Number(payrollEditForm.leaveDeduction) || 0,
      periodMonth: payrollMonth,
      hrNote: payrollEditForm.hrNote
    });
  }, [employees, records, payrollEmpId, payrollMonth, payrollEditForm, hrSettings]);

  const handleSaveMonthlyPayroll = (e) => {
    e.preventDefault();
    const nextOverrides = {
      ...payrollOverrides,
      [payrollPeriodKey]: {
        baseSalary: Number(payrollEditForm.baseSalary) || 0,
        allowances: Number(payrollEditForm.allowances) || 0,
        lateDeduction: Number(payrollEditForm.lateDeduction) || 0,
        leaveDeduction: Number(payrollEditForm.leaveDeduction) || 0,
        periodMonth: payrollMonth,
        hrNote: payrollEditForm.hrNote || ''
      }
    };
    updatePayrollOverrides(nextOverrides);
    showToast(`Gaji bulan ${payrollMonth} untuk ${liveDraftPayroll.emp.name} berhasil disimpan!`);
  };

  // ==========================================
  // VIEW 1: LOGIN PORTAL
  // ==========================================
  if (!isAuthenticated) {
    return (
      <div className="min-h-screen bg-gradient-to-br from-[#07182e] via-[#0b2545] to-[#104480] flex items-center justify-center p-4 font-sans text-slate-800 antialiased">
        <div className="bg-white/95 backdrop-blur-md rounded-3xl max-w-md w-full p-8 shadow-2xl border border-white/20 text-center relative overflow-hidden space-y-5">
          <div className="flex justify-center mb-1">
            <div className="bg-gradient-to-tr from-[#104480] to-[#1D6CB0] p-4 rounded-2xl shadow-xl shadow-[#104480]/30 border border-white/30">
              <OcrOasisLogo className="h-10" />
            </div>
          </div>

          <div>
            <h1 className="text-xl font-extrabold text-[#0b2545] tracking-tight">CV Oasis Creative Indonesia</h1>
            <p className="text-xs text-[#104480] font-semibold">HRIS Enterprise Portal & Operations System</p>
            <div className="mt-2 inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[10px] font-bold bg-sky-50 border border-sky-200 text-[#104480]">
              <span className={`w-2 h-2 rounded-full ${cloudOnline ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500'}`} />
              <span>{cloudOnline ? 'Cloud Real-Time Sync Aktif (PC & HP)' : 'Mode Sinkronisasi Lokal & Cloud'}</span>
            </div>
          </div>

          <div className="bg-sky-50/80 border border-sky-200/80 rounded-2xl p-3.5 text-xs text-[#104480] italic font-medium leading-relaxed shadow-sm">
            "{motivationalQuote}"
          </div>

          <div className="flex bg-slate-100 p-1.5 rounded-2xl text-xs font-semibold">
            <button
              type="button"
              onClick={() => { setActiveLoginRole('karyawan'); setLoginError(''); }}
              className={`flex-1 py-2.5 rounded-xl transition-all duration-200 ${activeLoginRole === 'karyawan' ? 'bg-[#0b2545] text-white shadow-md' : 'text-slate-600 hover:text-[#0b2545]'}`}
            >
              Portal Karyawan
            </button>
            <button
              type="button"
              onClick={() => { setActiveLoginRole('hrd'); setLoginError(''); }}
              className={`flex-1 py-2.5 rounded-xl transition-all duration-200 ${activeLoginRole === 'hrd' ? 'bg-[#0b2545] text-white shadow-md' : 'text-slate-600 hover:text-[#0b2545]'}`}
            >
              HRD & Manajemen
            </button>
          </div>

          {loginError && (
            <div className="p-3 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-xl font-medium text-left">
              {loginError}
            </div>
          )}

          <form onSubmit={handleLogin} className="space-y-4 text-left">
            {activeLoginRole === 'karyawan' ? (
              <>
                <div>
                  <label className="block text-xs font-bold text-[#0b2545] mb-1">ID Karyawan</label>
                  <input
                    type="text"
                    placeholder="Masukkan ID Karyawan Anda"
                    value={loginEmpId}
                    onChange={(e) => setLoginEmpId(e.target.value)}
                    className="w-full px-4 py-2.5 text-xs rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-[#104480] transition"
                    required
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-[#0b2545] mb-1">Password</label>
                  <input
                    type="password"
                    placeholder="Masukkan Password"
                    value={loginEmpPass}
                    onChange={(e) => setLoginEmpPass(e.target.value)}
                    className="w-full px-4 py-2.5 text-xs rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-[#104480] transition"
                    required
                  />
                </div>
              </>
            ) : (
              <>
                <div>
                  <label className="block text-xs font-bold text-[#0b2545] mb-1">ID HRD / Manajemen</label>
                  <input
                    type="text"

              e.preventDefault();
              updateCandidates([{ id: `CND-${Date.now()}`, ...candForm, stage: 'Menunggu Evaluasi' }, ...candidates]);
              setShowCandModal(false);
              showToast('Kandidat ditambahkan.');
            }}
            className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4 text-xs"
          >
            <h3 className="font-bold text-base text-[#0b2545]">Tambah Kandidat</h3>
            <input type="text" placeholder="Nama kandidat..." value={candForm.name} onChange={(e) => setCandForm({ ...candForm, name: e.target.value })} className="w-full p-2 border rounded-lg" required />
            <input type="text" placeholder="Posisi dilamar..." value={candForm.position} onChange={(e) => setCandForm({ ...candForm, position: e.target.value })} className="w-full p-2 border rounded-lg" required />
            <input type="date" value={candForm.interviewDate} onChange={(e) => setCandForm({ ...candForm, interviewDate: e.target.value })} className="w-full p-2 border rounded-lg" required />
            <div className="grid grid-cols-2 gap-2">
              <input type="number" placeholder="Skor Interview" value={candForm.interviewScore} onChange={(e) => setCandForm({ ...candForm, interviewScore: Number(e.target.value) })} className="p-2 border rounded-lg" />
              <input type="number" placeholder="Skor Skill Test" value={candForm.skillTestScore} onChange={(e) => setCandForm({ ...candForm, skillTestScore: Number(e.target.value) })} className="p-2 border rounded-lg" />
            </div>
            <textarea rows={2} placeholder="Catatan..." value={candForm.notes} onChange={(e) => setCandForm({ ...candForm, notes: e.target.value })} className="w-full p-2 border rounded-lg" />
            <div className="flex justify-end gap-2 pt-2 border-t">
              <button type="button" onClick={() => setShowCandModal(false)} className="px-4 py-2 border rounded-xl">Batal</button>
              <button type="submit" className="px-4 py-2 bg-[#104480] text-white font-bold rounded-xl">Simpan</button>
            </div>
          </form>
        </div>
      )}

      {overrideTarget && (
        <div className="fixed inset-0 bg-[#07182e]/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4 text-xs">
            <h3 className="font-bold text-base text-[#0b2545]">Override Jam Presensi ({overrideTarget.empName})</h3>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="block font-bold mb-1">Jam Masuk</label>
                <input type="text" value={overrideClockIn} onChange={(e) => setOverrideClockIn(e.target.value)} className="w-full p-2 border rounded-lg font-mono font-bold" />
              </div>
              <div>
                <label className="block font-bold mb-1">Jam Pulang</label>
                <input type="text" value={overrideClockOut} onChange={(e) => setOverrideClockOut(e.target.value)} className="w-full p-2 border rounded-lg font-mono font-bold" />
              </div>
            </div>
            <div className="flex justify-end gap-2 pt-2 border-t">
              <button type="button" onClick={() => setOverrideTarget(null)} className="px-3 py-1.5 border rounded-xl">Batal</button>
              <button
                type="button"
                onClick={() => {
                  updateRecords(records.map(r => r.id === overrideTarget.id ? { ...r, clockIn: overrideClockIn, clockOut: overrideClockOut, lateMinutes: 0, overrideByAdmin: true } : r));
                  setOverrideTarget(null);
                  showToast('Override jam presensi disimpan.');
                }}
                className="px-4 py-1.5 bg-[#104480] text-white font-bold rounded-xl"
              >
                Simpan Override
              </button>
            </div>
          </div>
        </div>
      )}

      {previewSelfieRecord && (
        <div className="fixed inset-0 bg-[#07182e]/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4 text-xs">
            <div className="flex justify-between items-center border-b pb-2">
              <h3 className="font-bold text-base text-[#0b2545]">Swafoto Presensi — {previewSelfieRecord.empName}</h3>
              <button type="button" onClick={() => setPreviewSelfieRecord(null)}><X className="w-5 h-5" /></button>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <span className="font-bold text-emerald-700 block mb-1">Swafoto Masuk ({previewSelfieRecord.clockIn})</span>
                {previewSelfieRecord.selfieInPhoto ? <img src={previewSelfieRecord.selfieInPhoto} alt="Masuk" className="w-full h-48 object-cover rounded-xl border" /> : <div className="h-48 bg-slate-100 rounded-xl flex items-center justify-center">Kosong</div>}
              </div>
              <div>
                <span className="font-bold text-[#104480] block mb-1">Swafoto Pulang ({previewSelfieRecord.clockOut})</span>
                {previewSelfieRecord.selfieOutPhoto ? <img src={previewSelfieRecord.selfieOutPhoto} alt="Pulang" className="w-full h-48 object-cover rounded-xl border" /> : <div className="h-48 bg-slate-100 rounded-xl flex items-center justify-center">Belum pulang</div>}
              </div>
            </div>
          </div>
        </div>
      )}

      {confirmDeleteEmp && (
        <div className="fixed inset-0 bg-[#07182e]/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4 text-xs">
            <h3 className="font-bold text-base text-rose-700">Hapus Karyawan?</h3>
            <p>Yakin ingin menghapus <strong>{confirmDeleteEmp.name}</strong> ({confirmDeleteEmp.id})?</p>
            <div className="flex justify-end gap-2 pt-2 border-t">
              <button type="button" onClick={() => setConfirmDeleteEmp(null)} className="px-4 py-2 border rounded-xl font-bold">Batal</button>
              <button type="button" onClick={() => { updateEmployees(employees.filter(e => e.id !== confirmDeleteEmp.id)); setConfirmDeleteEmp(null); showToast('Karyawan dihapus.'); }} className="px-4 py-2 bg-rose-600 text-white font-bold rounded-xl">Ya, Hapus</button>
            </div>
          </div>
        </div>
      )}

      {showSlipModal && (
        <div className="fixed inset-0 bg-[#07182e]/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-lg w-full p-7 shadow-2xl space-y-5 text-xs">
            <div className="bg-gradient-to-r from-[#0b2545] to-[#104480] text-white p-4 rounded-2xl flex justify-between items-center">
              <OcrOasisLogo className="h-7" />
              <div className="text-right">
                <div className="font-extrabold">SLIP GAJI RESMI</div>
                <div className="text-[10px] text-sky-200 font-mono">{payrollMonth}</div>
              </div>
            </div>
            <div className="grid grid-cols-2 gap-2 bg-slate-50 p-3 rounded-xl border">
              <p><strong>Nama:</strong> {liveDraftPayroll.emp.name}</p>
              <p><strong>ID:</strong> {liveDraftPayroll.emp.id}</p>
              <p><strong>Divisi:</strong> {liveDraftPayroll.emp.dept}</p>
              <p><strong>Rekening:</strong> {liveDraftPayroll.emp.bank}</p>
            </div>
            <div className="border-t border-b py-3 space-y-1.5">
              <div className="flex justify-between"><span>Fixed Paid:</span><span className="font-mono">Rp {liveDraftPayroll.baseSalary.toLocaleString('id-ID')}</span></div>
              <div className="flex justify-between"><span>Insentif Bulanan:</span><span className="font-mono">Rp {liveDraftPayroll.allowances.toLocaleString('id-ID')}</span></div>
              <div className="flex justify-between text-rose-600"><span>Denda Keterlambatan:</span><span className="font-mono">- Rp {liveDraftPayroll.lateDeduction.toLocaleString('id-ID')}</span></div>
              <div className="flex justify-between text-rose-600"><span>Potongan Izin:</span><span className="font-mono">- Rp {liveDraftPayroll.leaveDeduction.toLocaleString('id-ID')}</span></div>
              <div className="flex justify-between font-extrabold text-sm text-[#0b2545] pt-2 border-t">
                <span>GAJI BERSIH DITERIMA:</span>
                <span className="font-mono">Rp {liveDraftPayroll.netSalary.toLocaleString('id-ID')}</span>
              </div>
            </div>
            <div className="flex justify-end gap-2">
              <button
                type="button"
                onClick={() => handleDownloadSlipPdf(liveDraftPayroll)}
                className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl flex items-center gap-1.5"
              >
                <Download className="w-4 h-4" /> Auto Download PDF
              </button>
              <button onClick={() => setShowSlipModal(false)} className="px-5 py-2 bg-[#104480] text-white font-bold rounded-xl">Tutup</button>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

const rootEl = document.getElementById('root');
if (rootEl) {
  ReactDOM.createRoot(rootEl).render(<App />);
}

})();
</script>
</body>
</html>
